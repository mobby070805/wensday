[project]
name = "wensday-backend"
version = "0.1.0"
description = "Wensday — voice-first trilingual (Tamil / English / Tanglish) personal AI assistant backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyjwt>=2.8",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "cryptography>=42",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
# Qdrant is spoken over raw REST via httpx (see app/memory/vectorstore.py) — no client library needed.
prod = ["asyncpg>=0.29", "redis>=5.0", "alembic>=1.13"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2.3", "anyio", "fakeredis>=2.30"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::Warning:starlette", "ignore::UserWarning", "ignore:.*InsecureKeyLength.*"]
