name: wensday
description: Wensday — voice-first personal assistant for Tamil, English and Tanglish.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.1.0
  web_socket_channel: ^3.0.1
  flutter_local_notifications: ^17.2.2
  connectivity_plus: ^6.0.5
  url_launcher: ^6.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
