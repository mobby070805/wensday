name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    strategy: { matrix: { python: ["3.12", "3.13"] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q --timeout=60
        env: { PYTHONUTF8: "1" }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: "1" }

  e2e:
    # Real-browser validation: caught a real production bug in the past (an implicit-return
    # useEffect that TypeScript's `void`-return special-casing cannot detect statically -- see
    # docs/reports/phase-browser.md) that unit tests, typecheck and `next build` all missed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - name: Start the backend
        working-directory: backend
        run: |
          WENSDAY_DATABASE_URL="sqlite+aiosqlite:///$RUNNER_TEMP/e2e.db" WENSDAY_LLM_CHAIN='["offline"]' \
            WENSDAY_JWT_SECRET="ci-e2e-secret-32-characters-minimum" WENSDAY_CORS_ORIGINS='["http://localhost:3100"]' \
            PYTHONUTF8=1 python -m uvicorn app.main:factory --factory --port 8099 &
          for i in $(seq 1 30); do curl -sf http://localhost:8099/healthz && break; sleep 1; done
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run build
        working-directory: web
        env: { NEXT_TELEMETRY_DISABLED: "1", NEXT_PUBLIC_API_URL: "http://localhost:8099/api/v1" }
      - name: Start the web app
        working-directory: web
        run: |
          PORT=3100 npm run start &
          for i in $(seq 1 30); do curl -sf http://localhost:3100/login && break; sleep 1; done
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: web/test-results/, retention-days: 7 }

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-missing-schemas deploy/k8s/*.yaml
      - name: Validate compose file
        run: docker compose config -q

  images:
    needs: [backend, web, e2e, mobile, manifests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        run: echo "repo=$(echo '${{ github.repository_owner }}' | tr A-Z a-z)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.repo }}/wensday-api:${{ github.sha }},ghcr.io/${{ steps.meta.outputs.repo }}/wensday-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          build-args: NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || 'https://api.wensday.example.com/api/v1' }}
          tags: ghcr.io/${{ steps.meta.outputs.repo }}/wensday-web:${{ github.sha }},ghcr.io/${{ steps.meta.outputs.repo }}/wensday-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: images
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure cluster access
        run: |
          mkdir -p ~/.kube && echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
      - name: Migrate database
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr A-Z a-z)
          kubectl apply -k deploy/k8s
          # Jobs are immutable once created, so pin the image by substitution and recreate rather
          # than `kubectl set image` (which wouldn't reach a Job whose pod already started).
          sed "s#ghcr.io/OWNER/wensday-api:latest#ghcr.io/$OWNER/wensday-api:${{ github.sha }}#" \
            deploy/k8s/25-migrate-job.yaml > /tmp/migrate-job.yaml
          kubectl -n wensday delete job db-migrate --ignore-not-found
          kubectl -n wensday apply -f /tmp/migrate-job.yaml
          kubectl -n wensday wait --for=condition=complete job/db-migrate --timeout=180s || {
            echo "::error::migration job failed"; kubectl -n wensday logs job/db-migrate --tail=200; exit 1; }
      - name: Roll out
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr A-Z a-z)
          kubectl -n wensday set image deploy/api   api=ghcr.io/$OWNER/wensday-api:${{ github.sha }}
          kubectl -n wensday set image deploy/worker worker=ghcr.io/$OWNER/wensday-api:${{ github.sha }}
          kubectl -n wensday set image deploy/web   web=ghcr.io/$OWNER/wensday-web:${{ github.sha }}
          kubectl -n wensday rollout status deploy/api --timeout=180s
          kubectl -n wensday rollout status deploy/worker --timeout=120s
          kubectl -n wensday rollout status deploy/web --timeout=180s
