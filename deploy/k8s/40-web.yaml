apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: wensday, labels: { app: web } }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: ghcr.io/OWNER/wensday-web:latest
          ports: [{ containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /login, port: 3000 }, periodSeconds: 5 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 384Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: wensday }
spec: { selector: { app: web }, ports: [{ port: 80, targetPort: 3000 }] }
